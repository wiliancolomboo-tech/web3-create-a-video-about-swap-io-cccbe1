[package]
name = "swap_io"
version = "0.1.0"
description = "Swap.io AMM Protocol Core"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "swap_io"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.0", features = ["token_2022"] }